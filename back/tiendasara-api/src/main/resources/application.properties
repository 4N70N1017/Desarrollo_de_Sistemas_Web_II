# Configuración del servidor
server.port=8080

# Configuración de la base de datos MS SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TiendaSara;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=tu_contraseña_sql_server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=INFO
logging.level.com.tiendasara=DEBUG