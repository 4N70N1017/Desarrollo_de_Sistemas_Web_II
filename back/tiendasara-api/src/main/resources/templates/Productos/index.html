<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Tienda Sara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { background-color: white; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .btn-create { margin-bottom: 20px; }
        .product-image { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Products</h1>
            <a href="/products/new" class="btn btn-primary btn-create">
                <i class="fas fa-plus"></i> Create Product
            </a>
        </div>

        <div class="table-container">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Mark</th>
                        <th>Image</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.descripcion}"></td>
                        <td th:text="${'$' + product.precio}"></td>
                        <td th:text="${product.cantidad}"></td>
                        <td th:text="${product.categoria.descripcion}"></td>
                        <td th:text="${product.marca.descripcion}"></td>
                        <td>
                            <img th:if="${product.imagen}" th:src="${product.imagen}" alt="Product" class="product-image">
                            <span th:unless="${product.imagen}" class="text-muted">No image</span>
                        </td>
                        <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}"></td>
                        <td>
                            <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-sm btn-primary">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/products/{id}/delete(id=${product.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
