<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Product - Tienda Sara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .navbar {
            background-color: white;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
            margin-bottom: 30px;
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff !important;
        }

        .container {
            max-width: 900px;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            padding: 40px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: block;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
        }

        .image-preview img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .image-placeholder {
            width: 300px;
            height: 300px;
            background-color: #f0f0f0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin: 15px auto;
            border: 2px dashed #ddd;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 20px;
            }

            .page-title {
                font-size: 1.5rem;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
            text-decoration: none;
            color: white;
        }

        .alert {
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/products">
                <i class="fas fa-shopping-bag"></i> Tienda Sara
            </a>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">New Product</h1>

        <div class="form-card">
            <!-- Mensaje de error si existe -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle"></i> 
                <strong>Error:</strong> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/products}" th:object="${productDto}" method="post">
                <!-- Descripción -->
                <div class="form-group">
                    <label for="descripcion">Description</label>
                    <textarea id="descripcion" th:field="*{descripcion}" required placeholder="Enter product description"></textarea>
                    <span class="error-message" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
                </div>

                <!-- Fila: Precio y Cantidad -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="precio">Price</label>
                        <input type="number" id="precio" th:field="*{precio}" step="0.01" required placeholder="0.00">
                        <span class="error-message" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
                    </div>

                    <div class="form-group">
                        <label for="cantidad">Amount</label>
                        <input type="number" id="cantidad" th:field="*{cantidad}" required placeholder="0">
                        <span class="error-message" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></span>
                    </div>
                </div>

                <!-- Fila: Categoría y Marca -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="idCategoria">Category</label>
                        <select id="idCategoria" th:field="*{idCategoria}" required>
                            <option value="">Select a category</option>
                            <option th:each="category : ${categories}" 
                                    th:value="${category.id}" 
                                    th:text="${category.descripcion}">
                            </option>
                        </select>
                        <span class="error-message" th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}"></span>
                    </div>

                    <div class="form-group">
                        <label for="idMarca">Mark</label>
                        <select id="idMarca" th:field="*{idMarca}" required>
                            <option value="">Select a mark</option>
                            <option th:each="mark : ${marks}" 
                                    th:value="${mark.id}" 
                                    th:text="${mark.descripcion}">
                            </option>
                        </select>
                        <span class="error-message" th:if="${#fields.hasErrors('idMarca')}" th:errors="*{idMarca}"></span>
                    </div>
                </div>

                <!-- Imagen -->
                <div class="form-group">
                    <label for="imagen">Image URL</label>
                    <input type="text" id="imagen" th:field="*{imagen}" placeholder="https://example.com/image.jpg">
                    <span class="error-message" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></span>
                    
                    <!-- Preview de imagen -->
                    <div class="image-placeholder">
                        <i class="fas fa-image fa-3x"></i>
                    </div>
                </div>

                <!-- Botones -->
                <div class="button-group">
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i> Submit
                    </button>
                    <a href="/products" class="btn-cancel">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Actualizar preview de imagen en tiempo real
        document.getElementById('imagen').addEventListener('change', function() {
            const imgUrl = this.value;
            const placeholder = document.querySelector('.image-placeholder');
            
            if (imgUrl) {
                const img = new Image();
                img.src = imgUrl;
                img.onload = function() {
                    placeholder.innerHTML = '<img src="' + imgUrl + '" alt="Product" style="max-width: 300px; max-height: 300px; border-radius: 4px;">';
                };
                img.onerror = function() {
                    placeholder.innerHTML = '<i class="fas fa-image fa-3x"></i>';
                };
            } else {
                placeholder.innerHTML = '<i class="fas fa-image fa-3x"></i>';
            }
        });
    </script>
</body>
</html>
